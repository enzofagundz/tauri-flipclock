<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Flipclock">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141418" />
      <stop offset="1" stop-color="#07070a" />
    </linearGradient>
    <linearGradient id="cardUpper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33333a" />
      <stop offset="1" stop-color="#212127" />
    </linearGradient>
    <linearGradient id="cardLower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1b20" />
      <stop offset="1" stop-color="#101014" />
    </linearGradient>
    <clipPath id="cardLeft">
      <rect x="76" y="142" width="156" height="228" rx="16" />
    </clipPath>
    <clipPath id="cardRight">
      <rect x="280" y="142" width="156" height="228" rx="16" />
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#background)" />

  <g clip-path="url(#cardLeft)">
    <rect x="76" y="142" width="156" height="114" fill="url(#cardUpper)" />
    <rect x="76" y="256" width="156" height="114" fill="url(#cardLower)" />
    <text
      x="154"
      y="262"
      text-anchor="middle"
      font-family="Roboto Condensed, Arial Narrow, Helvetica, sans-serif"
      font-size="196"
      font-weight="700"
      fill="#f3f0e7"
    >1</text>
    <rect x="76" y="252" width="156" height="7" fill="#050506" />
  </g>

  <g clip-path="url(#cardRight)">
    <rect x="280" y="142" width="156" height="114" fill="url(#cardUpper)" />
    <rect x="280" y="256" width="156" height="114" fill="url(#cardLower)" />
    <text
      x="358"
      y="262"
      text-anchor="middle"
      font-family="Roboto Condensed, Arial Narrow, Helvetica, sans-serif"
      font-size="196"
      font-weight="700"
      fill="#f3f0e7"
    >2</text>
    <rect x="280" y="252" width="156" height="7" fill="#050506" />
  </g>

  <circle cx="80" cy="256" r="4" fill="#3a3a41" />
  <circle cx="228" cy="256" r="4" fill="#3a3a41" />
  <circle cx="284" cy="256" r="4" fill="#3a3a41" />
  <circle cx="432" cy="256" r="4" fill="#3a3a41" />
</svg>
